<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b101e"/>
      <stop offset="50%" stop-color="#07090e"/>
      <stop offset="100%" stop-color="#05070b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#00f2fe"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle border glow -->
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(0, 242, 254, 0.25)" stroke-width="2"/>
  
  <!-- Outer Shield Outline -->
  <path d="M256 70 C340 70 410 110 410 200 C410 325 256 430 256 430 C256 430 102 325 102 200 C102 110 172 70 256 70 Z" 
        fill="none" 
        stroke="url(#shieldGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"
  />

  <!-- Inner Shield Body -->
  <path d="M256 100 C320 100 376 132 376 205 C376 305 256 395 256 395 C256 395 136 305 136 205 C136 132 192 100 256 100 Z" 
        fill="rgba(99, 102, 241, 0.12)" 
        stroke="rgba(255, 255, 255, 0.15)" 
        stroke-width="4"
  />

  <!-- Central AI Trust Checkmark / Core Node -->
  <path d="M200 248 L238 286 L312 212" 
        fill="none" 
        stroke="url(#coreGrad)" 
        stroke-width="22" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#glow)"
  />

  <!-- Subtle pulse rings / circuit points -->
  <circle cx="256" cy="148" r="6" fill="#00f2fe"/>
  <circle cx="178" cy="205" r="5" fill="#8b5cf6"/>
  <circle cx="334" cy="205" r="5" fill="#8b5cf6"/>
  <circle cx="256" cy="350" r="5" fill="#10b981"/>
</svg>
